  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="3"/>
  <rect x="330" y="300" width="96" height="424" rx="22" fill="#e6e8ec"/>
