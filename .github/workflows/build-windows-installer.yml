# The Windows setup, built in the release run (add-windows-installer D2): `dist` no longer
# builds Windows, so this job builds the app with the same profile and features and packs it
# with Inno Setup into headquarter-setup-x86_64.exe and its .sha256. The release is published
# only when it succeeds. Inno Setup comes with the windows-2022 runner image (6.7.1 on
# 2026-11-10); the job stops if it is missing rather than install something unpinned.
name: Build Windows installer

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # A dry run from a branch before tagging, so a broken job costs no release candidate:
  # gh workflow run build-windows-installer.yml --ref <branch> -f plan='{"announcement_tag":"vX.Y.Z"}'
  workflow_dispatch:
    inputs:
      plan:
        description: The release plan; only announcement_tag is read.
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Build the app as dist did
        run: cargo build --locked --profile dist -p hq-app --bin headquarter-app --no-default-features
      - name: Version from the tag
        id: version
        shell: pwsh
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          # From cargo metadata: `cargo pkgid` prints `…/hq-app#0.4.0` for a package named
          # after its folder, with no `@` to split on (v0.4.0-rc.1 failed on it).
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'hq-app' }).version
          if (-not $version) {
            Write-Error "hq-app is not in the workspace metadata"
            exit 1
          }
          $tag = (ConvertFrom-Json $env:PLAN).announcement_tag
          if ("v$version" -ne $tag) {
            Write-Error "hq-app is $version but the release is $tag"
            exit 1
          }
          # Windows' file version is four numbers: the release without its pre-release part.
          $file = $version.Split('-')[0] + '.0'
          "app=$version" >> $env:GITHUB_OUTPUT
          "file=$file" >> $env:GITHUB_OUTPUT
      - name: Setup with Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup is not on this runner image"
            exit 1
          }
          $out = Join-Path $PWD 'windows-release'
          $exe = Join-Path $PWD 'target\dist\headquarter-app.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.app }}" "/DFileVersion=${{ steps.version.outputs.file }}" "/DSourceExe=$exe" "/DOutputDir=$out" packaging\windows\headquarter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksum
        shell: pwsh
        run: |
          $name = 'headquarter-setup-x86_64.exe'
          $hash = (Get-FileHash -Algorithm SHA256 "windows-release\$name").Hash.ToLower()
          # The same line as sha256sum writes, so `sha256sum -c` reads it anywhere.
          [IO.File]::WriteAllText((Join-Path $PWD "windows-release\$name.sha256"), "$hash  $name`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-windows-installer
          path: windows-release/*
