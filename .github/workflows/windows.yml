# The desktop app's client crates built, linted and tested on Windows for every pull
# request (add-windows-client D6): nothing on the owner's Mac builds for Windows.
# Formatting is the same on every platform and stays in ./scripts/check.
# It also runs on each push to main, only to keep the Rust cache warm: a pull request can
# restore caches saved on the default branch, not those of another pull request.
name: windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      # Saved from main only: pull requests restore it, and their own copies would only
      # crowd the repository's 10 GB of caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy -p hq-app -p hq-client -p hq-remote -p hq-protocol --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p hq-app -p hq-client -p hq-remote -p hq-protocol
