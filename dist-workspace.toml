# Release builds (add-release-installer D1, D5). `dist` builds the archives and the
# release workflow; scripts/install.sh installs them. Regenerate the workflow with
# `target/tools/bin/dist generate` after changing this file.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# Each package names its own targets. Windows is not one of them: its setup is built by
# ./build-windows-installer (add-windows-installer D2), so no Windows zip is published.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# gzip, not xz: minimal Linux systems (Debian slim, Alpine) have no xz.
unix-archive = ".tar.gz"
# Our own installer replaces dist's per-package ones (D1); it ships beside the archives.
installers = []
# Releases run only on version tags (D5); nothing runs on pull requests.
pr-run-mode = "skip"
install-updater = false
# The signed Android APK, built and signed in the same run (add-android-release D1). The
# release is published only when it succeeds.
# The Windows setup (add-windows-installer D2), likewise.
global-artifacts-jobs = ["./build-android", "./build-windows-installer"]
# Actions pinned to commits, so a moved tag cannot change what a release runs; `dist generate`
# writes them into release.yml. checkout v6.1.0, upload-artifact v7.0.2, download-artifact
# v8.0.2. Update them together with the hand-written workflows.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" }

[dist.github-custom-runners]
# Both Macs build on Apple Silicon `macos-15`: GitHub retired `macos-14` on 2026-11-02 (its jobs
# are cancelled before they start), and dist still defaults to it. The Intel build is cross-built
# there: the Intel runner took 1411 s, twice the next slowest build (2026-11-03), and
# `macos-15-intel` is GitHub's last Intel image.
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"

# GPUI's Linux platform links these at build time.
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libxcb1-dev = "*"
libx11-xcb-dev = "*"
libvulkan-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"

# The installer (D2) is published beside the archives, so the install line can fetch it
# from the latest release.
[[dist.extra-artifacts]]
artifacts = ["install.sh"]
build = ["cp", "scripts/install.sh", "install.sh"]
