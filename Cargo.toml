[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/alfonsusenrico/headquarter"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# GUI dependencies are large: keep line tables for our crates and no debug info for
# dependencies, so builds fit on a developer's disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# GPUI's macOS platform with idle windows stopping their display link
# (vendor/gpui-pre-macos/README-HEADQUARTER.md). Upgrade with the other gpui-pre crates.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# The release build (`dist`).
[profile.dist]
inherits = "release"
lto = "thin"

# The phone's core for the Android app (`scripts/android-core`): small, stripped. Panics
# unwind so UniFFI turns them into errors instead of ending the app.
[profile.mobile]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = true
