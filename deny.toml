# Dependency policy: permissive licences only (no GPL/AGPL code may enter Headquarter),
# no known vulnerable or unmaintained crates, crates.io only.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities and unsound crates are always errors. "Unmaintained" is checked for
# our direct dependencies only: GPUI's deep dependency tree carries several unmaintained
# crates (paste, rustybuzz, ttf-parser, zbus family) we cannot replace.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9
# The list is policy, not inventory; allowances may be unused today.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published and carry no licence field.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
