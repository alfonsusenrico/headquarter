[package]
name = "hq-cli"
version = "0.1.13"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Released: `hq` and `headquarter` (publish = false would hide them from dist).
[package.metadata.dist]
dist = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
hq-client = { version = "0.1.13", path = "../hq-client" }
hq-config = { version = "0.1.13", path = "../hq-config" }
hq-daemon = { version = "0.1.13", path = "../hq-daemon" }
hq-discovery = { version = "0.1.13", path = "../hq-discovery" }
hq-protocol = { version = "0.1.13", path = "../hq-protocol" }
hq-signals = { version = "0.1.13", path = "../hq-signals" }
qrcode = { version = "0.14", default-features = false }
serde_json = "1.0.154"
signal-hook = "0.4.5"

[lints]
workspace = true

[dev-dependencies]
alacritty_terminal = "=0.26.0"
hq-mobile = { version = "0.1.13", path = "../hq-mobile" }
hq-remote = { version = "0.1.13", path = "../hq-remote" }
iroh = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
