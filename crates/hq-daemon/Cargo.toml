[package]
name = "hq-daemon"
version = "0.1.20"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alacritty_terminal = "=0.26.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hq-config = { version = "0.1.20", path = "../hq-config" }
hq-discovery = { version = "0.1.20", path = "../hq-discovery" }
hq-protocol = { version = "0.1.20", path = "../hq-protocol" }
hq-remote = { version = "0.1.20", path = "../hq-remote" }
hq-signals = { version = "0.1.20", path = "../hq-signals" }
hq-store = { version = "0.1.20", path = "../hq-store" }
iroh = "1.4.1"
portable-pty = "0.9.0"
rustix = { version = "1.1.5", features = ["process", "system"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
trash = "5.2.9"
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true
